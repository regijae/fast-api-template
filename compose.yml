services:
  db:
    image: postgres:18
    restart: "no"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Variable not set} -d ${POSTGRES_DB:?Variable not set}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PSW:?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB:?Variable not set}

  api:
    image: api:local
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./alembic.ini:/app/alembic.ini
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      API_USERNAME: ${API_USERNAME:?Variable not set}
      API_PASSWORD: ${API_PASSWORD:?Variable not set}
      POSTGRES_SERVER: ${POSTGRES_SERVER:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:?Variable not set}
      POSTGRES_USER: ${POSTGRES_USER:?Variable not set}
      POSTGRES_PSW: ${POSTGRES_PSW:?Variable not set}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}
      WATCHFILES_FORCE_POLLING: "true"

volumes:
  app-db-data:
